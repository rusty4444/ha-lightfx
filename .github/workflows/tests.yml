name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-test-constraints.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt -c requirements-test-constraints.txt
      - name: Compile integration and tests
        run: python -m compileall -q custom_components tests
      - name: Run regression suite
        run: python -m pytest tests -q
